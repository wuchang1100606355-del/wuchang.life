core_rules:
  generative_transport:
    definition: 狀態重建式傳輸，不是單純壓縮。
    fast_reply_rule: 先回狀態，後補生成；大型重建排隊；完成後推送增量封包。
    main_risk: 狀態漂移，而非頻寬。
    required_controls:
      - manifest_validation
      - hash_verification
      - policy_check
      - delta_tracking
      - audit_ledger
      - dead_letter_on_failure

  intent_generative_construction:
    zh: 意圖生成式建構
    en: Intent-Generative Construction
    abbr: IGC
    formula: Intent -> State -> Packet -> Generate -> Verify -> Land
    definition: 將使用者意圖轉換為可驗證狀態封包，並於邊緣設備、伺服器或雲端節點上生成式重建任務、資料、流程或應用狀態。

  taiji01_node_role:
    role: 社區場控與執行副本節點
    allowed_roles:
      - login
      - permission_gate
      - packet_relay
      - manifest_index
      - hash_ledger
      - task_queue
      - cache
      - audit_log
      - community_query_runtime
    not_primary_roles:
      - mass_llm_generation
      - heavy_rebuild
      - full_plaintext_context_processing

  capacity_baseline:
    router_guest_network: 約250人接入，只代表網路容量，不等於伺服器生成能力。
    i7_16gb_headless_node:
      online_users_safe: 約80-150人
      concurrent_packet_interaction: 約20-60人
      local_llm_generation: 約1-3人同時
    distributed_compute_rule: 分散式算力必須依主控、工作、GPU、雲端、會員設備分工，不得混成不受控資源池。

  cloud_rule:
    principle: 雲端可參與，但雲端不應看見完整明文上下文。
    allowed:
      - packet_relay
      - manifest_index
      - hash_ledger
      - task_scheduler
      - non_sensitive_cache
      - backup_generation_node
    denied:
      - plaintext_member_data
      - full_context_storage
      - sovereign_keys
      - unmasked_behavior_logs
      - core_governance_rule_originals


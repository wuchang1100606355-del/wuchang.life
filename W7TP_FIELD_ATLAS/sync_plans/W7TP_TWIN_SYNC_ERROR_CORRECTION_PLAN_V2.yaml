d4_correction_flow:
  - freeze_current_evidence
  - build_source_hash_ledger
  - mirror_to_virtual_sandbox
  - run_manifest_python_xml_validation
  - produce_sync_diff_packet
  - human_review_gate
  - backup_runtime_carrier
  - sync_to_taiji01_plan_only
  - restart_only_after_explicit_approval

d5_required_artifacts:
  - W7TP_FIELD_ATLAS/01_universe_registry.yaml
  - W7TP_FIELD_ATLAS/source_hash_ledger/pm3_runtime_sync_hash_ledger.yaml
  - W7TP_FIELD_ATLAS/sync_plans/pm3_runtime_sync_to_taiji01_plan.yaml
  - W7TP_FIELD_ATLAS/runtime_status/latest_startup_state_packet.yaml
  - Taiji_Governance/twin_sync_red_team_report.md

d6_governance:
  allowed_now:
    - create_registry
    - create_hash_ledger
    - create_sync_plan
    - create_sandbox_directory
    - copy_into_sandbox_only
    - run_static_validation
  forbidden_now:
    - copy_into_taiji01_running_addons
    - docker_compose_up
    - restart_odoo
    - change_oauth_console
    - print_secrets
    - db_write

d7_validation:
  HASH_GATE:
    required: true
  MANIFEST_GATE:
    required: true
  PYTHON_IMPORT_GATE:
    required: true
  XML_GATE:
    required: true
  HUMAN_REVIEW_GATE:
    required: true
  ROLLBACK_GATE:
    required: true

d8_red_team_reflection:
  negative_effects:
    - twin_system_may_become_dual_master
    - sandbox_success_does_not_guarantee_production_success
    - sync_may_import_MSI_only_assumptions
    - secret_refs_may_not_exist_on_taiji01
    - odoo_version_addons_path_db_state_may_differ
  mitigation:
    - explicitly_label_source_twin_carrier
    - sync_code_and_manifest_only
    - never_sync_secrets
    - generate_diff_packet_first
    - require_human_review_before_runtime_landing
    - create_rollback_point_before_formal_landing

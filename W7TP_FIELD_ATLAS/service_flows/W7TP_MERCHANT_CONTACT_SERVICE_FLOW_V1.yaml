flow_id: W7TP_MERCHANT_CONTACT_SERVICE_FLOW_V1
status: PLAN_ONLY

target_sub_universe: SU_CONTACT_APPROVAL

flow:
  - merchant_submits_contact_request
  - xiaoj_checks_order_or_service_context
  - xiaoj_checks_purpose_code
  - member_receives_approval_request
  - member_approves_or_rejects
  - mediated_channel_created_if_approved
  - channel_expires_or_member_revokes
  - audit_record_written

service_outputs:
  approved:
    - mediated_contact_channel
    - expiry_time
  rejected:
    - contact_denied
  pending:
    - waiting_for_member_approval

forbidden:
  - raw_contact_export
  - marketing_without_opt_in
  - reuse_for_other_purpose

red_team_reflection:
  negative_effects:
    - merchant_may_spam_contact_requests
    - service_reason_may_mask_marketing
  mitigation:
    - request_rate_limit
    - complaint_score_affects_node_credit
    - separate_marketing_opt_in

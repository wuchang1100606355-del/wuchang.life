linter_plan_id: W7TP_NO_SECRET_LINTER_PLAN_V1
status: PLAN_ONLY

purpose:
  - prevent_secret_literals_from_entering_addons
  - prevent_plaintext_member_data_leakage
  - enforce_secret_refs_only

scope:
  target:
    - sandbox_addons
    - split_target_addons
    - sync_plan_candidates
  excluded:
    - encrypted_backup
    - sealed_private_data_store
    - local_env_files_not_printed

forbidden_literal_patterns:
  hard_block:
    - "PRIVATE KEY"
    - "BEGIN RSA PRIVATE KEY"
    - "BEGIN OPENSSH PRIVATE KEY"
    - "sk-"
    - "xoxb-"
    - "ghp_"
    - "CLIENT_SECRET="
    - "PM3_IDENTITY_HMAC_SECRET="
    - "PASSWORD="
  review_required:
    - "phone"
    - "mobile"
    - "address"
    - "national_id"
    - "line_user_id"
    - "google_sub"
    - "email"

allowed_patterns:
  - "SECRET_REF"
  - "ENV_REF"
  - "VAULT_REF"
  - "encrypted_payload_ref"
  - "identity_hash"
  - "member_code"
  - "8d_identity_packet"

actions:
  on_hard_block:
    - stop_validation
    - create_failed_gate_report
    - do_not_copy_to_runtime

  on_review_required:
    - create_xiaoj_review_opinion_plus_final_authorization_notice
    - require_context_check

governance:
  no_secret_print: true
  no_runtime_write: true
  no_auto_fix: true
  plan_only: true

red_team_reflection:
  negative_effects:
    - may flag harmless words such as email or phone in schema comments
    - may miss encoded or indirect secrets
    - overblocking may slow development
  mitigation:
    - classify hard_block vs review_required
    - keep reports path-only where possible
    - never print matched secret values

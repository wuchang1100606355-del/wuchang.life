policy_id: W7TP_UNTRACKED_ARCHIVE_POLICY_V1
status: PLAN_ONLY

purpose:
  - prevent_untracked_files_from_blocking_progress
  - preserve_unclassified_work_without_git_pollution
  - support_later_review

archive_target:
  base_dir: /home/taiji_admin/Taiji_Git_Bundles
  method:
    - tar_gz
    - sha256

rules:
  - untracked_files_not_in_safe_scope_should_be_archived
  - archive_is_not_approval_to_push
  - archive_is_evidence_preservation
  - later_classification_required_before_git_add

forbidden:
  - archive_secrets_to_cloud_without_review
  - delete_untracked_after_archive_without_approval
  - treat_archive_as_clean_review

red_team_reflection:
  negative_effects:
    - archives_may_store_sensitive_files
    - too_many_archives_can_consume_disk
  mitigation:
    - local_only_by_default
    - sha256_manifest
    - retention_policy_later

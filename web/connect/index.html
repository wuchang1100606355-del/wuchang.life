<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f5f1e8">
  <title>聊國咖啡會員 Wi‑Fi｜五常社區發展協會</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root{color-scheme:light;--bg:#f5f1e8;--card:#fffdf8;--ink:#1f2a28;--muted:#66706c;--line:#ddd6c7;--accent:#235f52;--accent2:#163f37}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#ece5d7 0,#f5f1e8 42%,#f8f6f0 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    main{min-height:100svh;display:grid;place-items:center;padding:24px}
    .card{width:min(680px,100%);background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 18px 56px rgba(35,50,45,.12)}
    .eyebrow{font-size:.82rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
    h1{margin:.55rem 0 .65rem;font-size:clamp(2rem,8vw,3.2rem);line-height:1.08}
    .lead{font-size:1.05rem;line-height:1.8;color:var(--muted);margin:0 0 24px}
    .status{border:1px solid #c8d9d3;background:#eef7f4;border-radius:16px;padding:14px 16px;margin:0 0 22px;line-height:1.65}
    .actions{display:grid;gap:12px}
    a.btn{display:block;text-decoration:none;text-align:center;border-radius:14px;padding:15px 18px;font-weight:700;border:1px solid var(--accent)}
    a.primary{background:var(--accent);color:#fff}
    a.primary:hover{background:var(--accent2)}
    a.secondary{background:#fff;color:var(--accent)}
    .note{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:.88rem;line-height:1.7;color:var(--muted)}
    .brand{margin-top:20px;font-size:.82rem;color:#7b817d}
    @media(max-width:520px){main{padding:14px}.card{padding:24px 18px;border-radius:20px}}
  </style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="title">
    <div class="eyebrow">WUCHANG MEMBER ACCESS · 店內會員入口</div>
    <h1 id="title">聊國咖啡會員 Wi‑Fi</h1>
    <p class="lead">您已進入聊國咖啡／五常社區的會員來賓網路。店內設備與會員網路彼此隔離；會員服務統一由 <strong>wuchang.life</strong> 提供。</p>

    <div class="status">
      <strong>連線原則</strong><br>
      店內設備走 LAN（區域網路）直連；會員走網域；VPN（虛擬私人網路）只供遠端管理與備援。
    </div>

    <nav class="actions" aria-label="會員服務">
      <a class="btn primary" href="/google/member/login">Google 會員登入</a>
      <a class="btn secondary" href="/web/login">會員帳號登入</a>
      <a class="btn secondary" href="/member_recruitment/">加入會員／免費訂閱</a>
      <a class="btn secondary" href="https://member.wuchang.life/">進入會員服務</a>
    </nav>

    <p class="note">使用店內 Wi‑Fi 前，仍以 ASUS（華碩）來賓網路入口頁顯示之服務條款與同意程序為準。會員資料不儲存在路由器；身分與服務由會員系統處理。</p>
    <div class="brand">新北市三重區五常社區發展協會 · 聊國咖啡烘焙館</div>
  </section>
</main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">五常智慧雲分享預覽</title>
  <desc id="desc">五常智慧雲公開網站分享預覽，呈現主權 AI 個人管家小J與 8 維度意圖場封包技術。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe2"/>
      <stop offset=".58" stop-color="#edf7fb"/>
      <stop offset="1" stop-color="#dfe8ef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4fbfc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#102036" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity=".28" stroke="#17253a" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>
  <rect x="72" y="72" width="1056" height="486" rx="34" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="112" y="112" width="96" height="96" rx="22" fill="#1f6d60"/>
  <text x="140" y="178" fill="#ffffff" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="54" font-weight="900">五</text>
  <text x="232" y="146" fill="#1f6d60" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="28" font-weight="900">五常智慧雲</text>
  <text x="232" y="184" fill="#5a6678" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="700">主權 AI 個人管家小J · 社區公益 · 物業商家</text>
  <text x="112" y="282" fill="#17253a" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="56" font-weight="900">人類才是 AI 的主人</text>
  <text x="112" y="354" fill="#17253a" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="44" font-weight="850">以人類意圖場治理 AI 幻覺</text>
  <text x="112" y="420" fill="#1f6d60" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="32" font-weight="900">8 維度意圖場封包技術</text>
  <g transform="translate(770 160)">
    <rect x="0" y="0" width="270" height="270" rx="30" fill="#0b2b48"/>
    <circle cx="198" cy="70" r="42" fill="#f8d87c" opacity=".7"/>
    <circle cx="76" cy="82" r="18" fill="#9cc7ff" opacity=".78"/>
    <path d="M38 196c70-74 125-74 190 0" fill="none" stroke="#f7fbff" stroke-width="11" stroke-linecap="round" opacity=".9"/>
    <path d="M64 146h142" stroke="#f8d87c" stroke-width="9" stroke-linecap="round"/>
    <text x="72" y="230" fill="#f7fbff" font-family="ui-monospace, monospace" font-size="26" font-weight="900">D1 → D8</text>
  </g>
  <text x="112" y="504" fill="#5a6678" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="24" font-weight="700">wuchang.life · 公開展示階段 · Production release HOLD</text>
</svg>

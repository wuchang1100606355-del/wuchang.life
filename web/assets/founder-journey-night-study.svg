      <stop offset=".42" stop-color="#ffd26f" stop-opacity=".58"/>
      <stop offset="1" stop-color="#ffd26f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">

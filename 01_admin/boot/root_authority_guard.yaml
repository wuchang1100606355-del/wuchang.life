root_authority:
  owner: CHIANG_CHENG_LUNG
  online_mode:
    allow_authority_level: 5
  offline_mode:
    allow_authority_level: 2
    allow:
      - health_check
      - restart_service
      - local_inference
      - status_report
      - create_draft

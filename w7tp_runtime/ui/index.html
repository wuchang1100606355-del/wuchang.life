<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W7TP生成式傳輸轉檔器</title><link rel="stylesheet" href="/app.css"></head><body><main><header><h1>W7TP生成式傳輸轉檔器</h1><p>本機離線｜來源攝取不是生成式傳輸本身</p></header><form id="job"><fieldset><legend>1 選擇來源檔案</legend><label for="source">本機來源檔案</label><input id="source" type="file" required></fieldset><fieldset><legend>2 選擇重構目標</legend><label><input type="radio" name="os" value="portable" checked> 可攜式</label><label><input type="radio" name="os" value="windows"> Windows</label><label><input type="radio" name="os" value="linux"> Linux</label></fieldset><fieldset><legend>3 選擇本機輸出資料夾</legend><p>成品保存在本機服務的安全工作區，可於完成後取得。</p><label for="target">成品檔名</label><input id="target" value="reconstructed.bin" required></fieldset><button type="submit">4 開始生成式轉檔</button></form><section aria-live="polite" aria-atomic="true"><h2>工作狀態：<span id="state">等待</span></h2><dl id="result"></dl><nav><a id="packet" hidden>查看封包</a><a id="report" hidden>查看報告</a><a id="output" hidden>取得成品</a></nav><details><summary>進階 JSON</summary><pre id="json"></pre></details></section></main><script src="/app.js"></script></body></html>

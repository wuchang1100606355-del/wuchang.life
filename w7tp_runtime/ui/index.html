<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>W7TP單一自重構封包建構驗證台</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <header>
    <h1>W7TP單一自重構封包建構驗證台</h1>
    <p class="canonical">Founder canonical目標：一個封包｜直接開啟｜自行重構｜自行驗證</p>
    <p class="disclosure">目前狀態：底層單一封包binding尚未完成，本介面為建構驗證台。</p>
  </header>
  <section aria-labelledby="packet-requirements">
    <h2 id="packet-requirements">單一封包應攜帶</h2>
    <ul><li>8D狀態</li><li>引用能力</li><li>查表能力</li><li>傳輸協定</li><li>重構條件</li><li>驗證方法</li></ul>
  </section>
  <form id="job">
    <fieldset>
      <legend>1 選擇檔案</legend>
      <label for="source">所有檔案均可選擇並進入建構流程</label>
      <input id="source" type="file" required aria-required="true">
    </fieldset>
    <button type="submit">2 開始單一封包建構驗證</button>
  </form>
  <section aria-live="polite" aria-atomic="true">
    <h2>工作狀態：<span id="state">等待</span></h2>
    <p id="guidance">選擇檔案後開始建構驗證。</p>
    <dl id="result"></dl>
    <nav aria-label="工作成果">
      <a id="packet" class="artifact disabled" aria-disabled="true">取得封包</a>
      <a id="report" class="artifact disabled" aria-disabled="true">取得報告</a>
      <button id="capabilities" class="artifact" type="button" disabled>能力摘要</button>
    </nav>
    <details><summary>進階 JSON</summary><pre id="json"></pre></details>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>

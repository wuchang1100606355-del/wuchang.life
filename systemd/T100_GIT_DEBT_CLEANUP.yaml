  protected_secret_rule: NEVER_READ_HASH_STAGE_OR_PRINT

final_dispositions:
  - id: REVIEWED_PUSHED_GITHUB
    meaning: reviewed exact content is committed, non-force pushed, and linked to a live GitHub review coordinate
    authority_state: USER_EXPLICIT
  - id: REVOKED_OR_DELETED
    meaning: obsolete or unsafe state is recoverably removed after duplicate, dependency, and authority checks
    authority_state: USER_EXPLICIT
  - id: VERIFIED_COLD_BUNDLE_ARCHIVE
    meaning: unique history that should not remain active is preserved as a verified Git bundle plus SHA256, without a live cloud .git directory
    authority_state: INFERRED_PENDING_USER_CONFIRMATION
    inference_source: git_space/policies/git_central_management_policy_v1.yaml

completion_invariants:
  every_coordinate_has_exactly_one_final_disposition_receipt: true
  local_dirty_staged_modified_untracked_entries: 0
  local_only_commits: 0
  nondefault_remote_branches_without_review_or_retirement: 0
  cloud_live_dot_git_directories: 0
  force_pushes: 0
  broad_git_add_operations: 0
  secrets_read_hashed_staged_or_printed: 0

joint_8d_state_field:
  semantics: 8_IN_1_SINGLE_STATE_FIELD
  projections:
    D1_INTENT: close all Git state through an explicit final disposition
    D2_STATE: live repository, index, worktree, branch, PR, cloud, and container state
    D3_COORDINATE: node, absolute root, common git dir, branch, head, tree, remote, and PR
    D4_EVIDENCE: status, content hashes, commit objects, PR metadata, bundle verification, and receipts
    D5_EXECUTION_POLICY: exact-path stage, non-force push, recoverable revocation, and bounded deletion
    D6_GENERATIVE_TRANSMISSION: Git is only a carrier; no W7TP completion is inferred from Git transport
    D7_RISK_QUARANTINE: secrets, incomplete object stores, pre-existing index state, and coordinate drift fail closed
    D8_ENVELOPE_AUTHORITY: explicit user authorization plus valid remote and review coordinates
  coupling_rule: every mutation must bind all eight projections to the same before-and-after coordinate
  cross_dimension_constraint: no evidence, execution, or disposition may refer to different heads, trees, or paths
  joint_state_transition: OBSERVED_TO_CLASSIFIED_TO_REVIEWED_TO_DISPOSED_TO_VERIFIED
  closure_rule: all completion invariants must hold in one final full-system rescan
  fail_closed_rule: any unknown content, missing authority, drift, or incomplete object graph remains HOLD


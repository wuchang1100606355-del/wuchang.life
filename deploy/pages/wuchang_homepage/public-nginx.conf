server_tokens off;
access_log /dev/stdout;
error_log /dev/stderr warn;

add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;

server {
    listen 8089 default_server;
    server_name _;
    autoindex off;
    return 404;
}

server {
    listen 8089;
    server_name wuchang.life www.wuchang.life;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /assets/css/style.css {
        try_files /assets/css/style.css =404;
    }

    location / {
        return 404;
    }
}

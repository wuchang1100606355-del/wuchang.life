name: wuchang-homepage-public

services:
  wuchang-homepage-public:
    image: ${WUCHANG_HOMEPAGE_IMAGE_ID:?WUCHANG_HOMEPAGE_IMAGE_ID is required}
    container_name: wuchang-homepage-public
    labels:
      org.wuchang.homepage.deploy_tool: deploy_wuchang_homepage_no_dns.v1
    pull_policy: never
    restart: unless-stopped
    user: "101:101"
    read_only: true
    ports:
      - "127.0.0.1:8089:8089"
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,noexec,nosuid,nodev
      - /var/run:uid=101,gid=101,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --header='Host: wuchang.life' http://127.0.0.1:8089/ || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

networks:
  default:
    name: wuchang-homepage-public-internal
    internal: true

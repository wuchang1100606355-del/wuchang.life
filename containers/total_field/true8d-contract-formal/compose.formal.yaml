name: w7tp-true8d-formal-dark-launch

x-common: &common
  image: w7tp-indexer@sha256:2a963ec0cfd2c8558c0912fc8098cef7da4d50cb359a53c052849efb3c8e151e
  pull_policy: never
  profiles: ["formal-dark-launch"]
  user: "65534:65534"
  working_dir: /formal
  command: ["sh", "-c", "sleep infinity"]
  networks:
    - true8d_formal_internal
  volumes:
    - type: bind
      source: ../../..
      target: /formal
      read_only: true
  read_only: true
  restart: "no"
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  pids_limit: 32
  labels:
    w7tp.run_id: "W7TP_TRUE8D_FORMAL_DEPLOYMENT_MANIFEST_V1"
    w7tp.source_run: "W7TP_TOTAL_FIELD_NON_LIVE_BUILD_20260718T110758Z"
    w7tp.target_hostname: "taiji01"
    w7tp.formal_profile: "formal-dark-launch"
    w7tp.deployment_phase: "dark-launch"
    w7tp.server_llm: "BLOCK"
    w7tp.msi_ollama_candidate_migration: "BLOCK"

x-projection-budget: &projection_budget
  cpus: "0.350"
  mem_limit: 384m
  mem_reservation: 176m

x-d8-budget: &d8_budget
  cpus: "0.550"
  mem_limit: 384m
  mem_reservation: 176m

x-core-budget: &core_budget
  cpus: "1.000"
  mem_limit: 1024m
  mem_reservation: 512m

services:
  d1:
    <<: [*common, *projection_budget]
    container_name: w7tp_true8d_formal_d1
    labels:
      w7tp.field_id: "D1"
      w7tp.authority: "non-authoritative-projection"
    healthcheck:
      test: ["CMD", "python3", "tools/total_field/w7tp_true8d_contract_sandbox.py", "--field", "D1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  d2:

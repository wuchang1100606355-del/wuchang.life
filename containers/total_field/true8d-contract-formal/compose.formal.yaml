    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "tools/total_field/w7tp_d8_reviewer_entrypoint.py"
        - "status"
        - "--intake-dir"
        - "/formal/runtime/total_field/d8_reviewer_intake"

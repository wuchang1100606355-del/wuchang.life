policy_id: secret_redaction_policy_v1
purpose: Prevent historical evidence, Git bundles, and backups from storing secrets.

forbidden_patterns:
  - "BEGIN PRIVATE KEY"
  - "private_key"
  - "access_token"
  - "refresh_token"
  - "session_id"
  - "cookie"
  - "sk-"
  - "AIza"

blocked_paths:
  - evidence/full_scope_selfdev_20260508_025146
  - Downloads
  - "*.json service account key"
  - raw shell history
  - database dump

rule:
  - do_not_commit_raw_historical_evidence_before_redaction
  - commit_redacted_inventory_only
  - rotate_exposed_keys_if ever found in real files
  - keep evidence hash only after redaction

<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><title>五常大陣 - 賈維斯觀測儀</title><style>body{background:#0b0f19;color:#38bdf8;font-family:monospace;padding:20px;}</style></head>
<body><h1>五常太極大陣 v22.0</h1><p>API: <input type="text" id="api" value="http://127.0.0.1:8000" style="background:#1e293b;color:#fff;"></p>
<button onclick="check()" style="padding:10px;background:#047857;color:white;border:none;">掃描度規張量</button>
<button onclick="strike()" style="padding:10px;background:#b45309;color:white;border:none;">發動實體探測</button>
<pre id="log" style="background:#000;padding:15px;color:#a3e635;">待命...</pre>
<script>const log=m=>document.getElementById('log').innerText+='\n> '+m; async function check(){try{const r=await fetch(document.getElementById('api').value+'/api/v1/tensor');log(JSON.stringify(await r.json(),null,2));}catch(e){log('連線失敗');}} async function strike(){try{const r=await fetch(document.getElementById('api').value+'/api/v1/forward/mu_2',{method:'POST'});log((await r.json()).message);}catch(e){log('打擊失敗');}}</script></body></html>

services:
  wuchang-domain-gateway:
    image: "sha256:${WUCHANG_DOMAIN_GATEWAY_IMAGE_SHA256:?WUCHANG_DOMAIN_GATEWAY_IMAGE_SHA256 must be the 64-character lowercase sha256 image ID}"
    pull_policy: never
    container_name: wuchang-domain-gateway
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0750
      - /var/run:rw,noexec,nosuid,nodev,size=1m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 64m
    memswap_limit: 64m
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - nginx -t >/dev/null 2>&1 && pid="$$(cat /var/run/nginx.pid 2>/dev/null)" && test -n "$$pid" && kill -0 "$$pid"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:8088:8088"
    networks:
      - domain-gateway-internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  domain-gateway-internal:
    name: wuchang-domain-gateway-internal
    external: true

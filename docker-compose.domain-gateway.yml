services:
  wuchang-domain-gateway:
    image: nginx:alpine
    container_name: wuchang-domain-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/domain_gateway/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

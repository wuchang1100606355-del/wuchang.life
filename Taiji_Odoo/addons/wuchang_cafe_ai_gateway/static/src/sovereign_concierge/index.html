<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小J｜主權 AI 私人服務員</title><link rel="stylesheet" href="./app.css">
</head><body><main>
<header><div class="eyebrow">W7TP / 8D ADI V2.3</div><h1>小J</h1><p>主權 AI 私人服務員</p><span id="runtime" class="pill">連線中</span></header>
<section class="hero"><h2>你現在想做什麼？</h2><textarea id="intent" rows="3" placeholder="例如：我想喝點東西，但不知道怎麼選比較划算"></textarea><button id="understand">讓小J理解</button><p class="fine">這段暫態意圖只留在本頁，不直接寫入長期會員狀態。</p></section>
<section id="suggestion" class="card hidden"><div class="tag">小J主動建議</div><h2 id="suggestionTitle"></h2><p id="suggestionBody"></p><button id="why" class="secondary">小J為什麼這樣建議？</button><button id="doit">幫我做</button></section>
<section id="authority" class="card hidden"><div class="tag">權限不是模型決定</div><h2 id="authorityTitle">等待本人確認</h2><p id="authorityBody"></p><button id="confirm">本人確認使用 1 張</button><button id="deny" class="secondary">不同意</button></section>
<section id="result" class="card hidden"><div class="tag">真實作用</div><h2 id="resultTitle"></h2><p id="resultBody"></p><code id="txhash"></code></section>
<section id="evidence" class="card hidden"><div class="tag">8D ADI 證據</div><div id="field"></div></section>
<section class="card"><div class="tag">能力隔離</div><p>Cloud AI（雲端人工智慧）不是此交易必要依賴；不呼叫雲端模型，已授權的本地交易鏈仍可繼續。模型本身沒有扣券權。</p></section>
<footer>聊國咖啡館重新總店｜紅茶提貨券授權沙盒</footer>
</main><script src="./app.js"></script></body></html>

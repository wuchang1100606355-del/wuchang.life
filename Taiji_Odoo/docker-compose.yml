services:
  wuchang_os_pg:
    image: postgres:15
    container_name: wuchang_os_pg
    restart: unless-stopped
    env_file:
      - ${TAIJI_ODOO_ENV_FILE:?Set the mode-600 production env file}
    volumes:
      - fused_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      w7tp.stage: FUSED
      w7tp.live_cutover: AUTHORIZED

  wuchang_os_odoo_18:
    image: odoo:18.0
    container_name: wuchang_os_odoo_18
    restart: unless-stopped
    depends_on:
      wuchang_os_pg:
        condition: service_healthy
    command:
      - odoo
      - -d
      - ${POSTGRES_DB:-wuchang_odoo}
      - --db-filter=^${POSTGRES_DB:-wuchang_odoo}$
      - --no-database-list
    env_file:
      - ${TAIJI_ODOO_ENV_FILE:?Set the mode-600 production env file}
    environment:
      HOST: wuchang_os_pg
      USER: ${POSTGRES_USER:-odoo}
      WUCHANG_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_member_client_secret
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - ${TAIJI_ODOO_ADDONS_DIR:?Set the fused addon directory}:/mnt/extra-addons:ro
      - ${TAIJI_ODOO_DATA_DIR:?Set the fused Odoo data directory}:/var/lib/odoo
      - /home/taiji_admin/.config/wuchang/secrets/google_member_client_secret:/run/secrets/google_member_client_secret:ro
    labels:
      w7tp.stage: FUSED
      w7tp.live_cutover: AUTHORIZED

volumes:
  fused_pgdata:
    external: true
    name: taiji_odoo_fusion_candidate_pgdata

networks:
  default:
    name: taiji_odoo_default

services:

  wuchang_os_odoo_18:
    image: odoo:18.0
    container_name: wuchang_os_odoo_18
    restart: unless-stopped
    command:
      - odoo
      - -d
      - wuchang_odoo
      - --db-filter=^wuchang_odoo$
      - --no-database-list
    depends_on:
      - wuchang_os_pg

    ports:
      - "192.168.50.249:8069:8069"

    volumes:
      - ./addons:/mnt/extra-addons
      - ./odoo_data:/var/lib/odoo
      - /mnt/c/Taiji_Runtime:/mnt/taiji_runtime:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro

    environment:
      HOST: wuchang_os_pg
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PM3_IDENTITY_HMAC_SECRET: ${PM3_IDENTITY_HMAC_SECRET:?PM3_IDENTITY_HMAC_SECRET is required}

  wuchang_os_pg:
    image: postgres:15
    container_name: wuchang_os_pg
    restart: always

    environment:
      POSTGRES_DB: wuchang_odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - ./postgres_data:/var/lib/postgresql/data
